version: "3.9"
services:
  db:
    image: postgres:15.8-alpine3.20
    restart: always
    shm_size: 128mb
    container_name: student-crm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_crm_db
    ports:
      - "5432:5432"

  app:
      build:
          context: ./backend
          dockerfile: src/main/docker/Dockerfile.jvm
      container_name: student-crm-backend
      environment:
          QUARKUS_DATASOURCE_URL: jdbc:postgresql://db:5432/student_crm_db
          QUARKUS_DATASOURCE_USERNAME: postgres
          QUARKUS_DATASOURCE_PASSWORD: postgres
      depends_on:
          - db
      ports:
          - "8080:8080"
